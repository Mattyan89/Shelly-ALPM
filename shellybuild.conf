# Optional overrides for Shelly's in-process AUR builder.
#
# Shelly has compiled defaults for every setting below.  This installed file is
# deliberately inert: uncomment only the values that should be system-wide
# overrides.  Per-user overrides belong in
# $XDG_CONFIG_HOME/shelly/shellybuild.conf.

[build]
# carch = "x86_64"
# chost = "x86_64-pc-linux-gnu"
# cppflags = []
# cflags = ["-O2", "-pipe"]
# cxxflags = ["-O2", "-pipe"]
# ldflags = ["-Wl,-z,relro", "-Wl,-z,now"]
# ltoflags = ["-flto=auto"]
# makeflags = ["-j2"]
# check = true
# ccache = false
# distcc = false
# distcc_hosts = []
# Native builds use a fixed system PATH, independent of the terminal/elevator.
# Extra absolute directories precede system tools (after ccache/distcc).
# Each directory must exist and be searchable by the build user.
# extra_path = ["/opt/toolchain/bin", "/home/your-user/.cargo/bin"]
# Literal variables for unprivileged native build subprocesses (also isolated).
# The user table replaces the system table; env = {} clears assignments.
# No shell, $HOME, or ~ expansion. Use extra_path and dedicated flag settings
# for PATH and compiler flags; identity and process-startup variables are reserved.
# env = { JAVA_HOME = "/usr/lib/jvm/default", CARGO_HOME = "/home/your-user/.cargo" }

[package]
# packager = "Unknown Packager"
# extension = ".pkg.tar.zst"
# Planned compression presets (not implemented yet; keep this key commented).
# The extension selects the format; each preset maps to its backend level:
# Level  Preset        zstd  gzip  xz  bzip2  Intended tradeoff
# 1      Conservative    1     1   0      1  Low resource use; larger packages
# 2      Fast            3     3   3      3  Quick builds; reasonable compression
# 3      Balanced        6     6   6      5  Recommended starting point
# 4      Compact        12     8   7      7  Favor smaller packages
# 5      Maximum        19     9   9      9  Highest compression effort offered
# All presets are lossless. Reliability here means reducing memory pressure
# and build time. Higher levels generally use more resources for smaller
# packages, but do not guarantee smaller output for every input.
# These proposed mappings will be validated with benchmarks before release.
# Planned precedence: CLI --compression-level > user config > system config.
# Omitting the setting everywhere will retain the library's current defaults.
# compression_level = 3
# options = ["strip", "docs", "emptydirs", "zipman", "purge", "lto"]
# strip_binaries = ["--strip-all"]
# strip_shared = ["--strip-debug"]
# strip_static = ["--strip-unneeded"]
# sign = false
# sign_key = ""

[destinations]
# build = "/var/tmp/shellybuild"
# packages = "/var/cache/shelly/packages"
# sources = "/var/cache/shelly/sources"
# logs = "/var/log/shelly/build"

[sandbox]
#enabled = true
#extra_read = []
#extra_write = []
